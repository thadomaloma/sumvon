<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#123b36">
    <title>You're offline · Sumvon</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: #fafaf9; color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 440px; text-align: center; }
      .mark { margin: 0 auto; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 18px; background: #123b36; color: white; font-size: 22px; font-weight: 700; }
      h1 { margin: 24px 0 0; font-size: 28px; letter-spacing: -.03em; }
      p { margin: 12px auto 0; max-width: 360px; color: #475569; line-height: 1.6; }
      button { margin-top: 28px; min-height: 48px; border: 0; border-radius: 14px; padding: 0 22px; background: #123b36; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      button:focus-visible { outline: 3px solid #0f766e; outline-offset: 3px; }
      small { display: block; margin-top: 18px; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <h1>You're offline</h1>
      <p>Connect to the internet to view current financial data or save new changes. Sumvon never presents cached balances as current.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <small>Your financial records remain on the secure server.</small>
    </main>
  </body>
</html>
